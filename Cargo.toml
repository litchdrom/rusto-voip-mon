[package]
name = "rusto-voip-mon"
version = "0.1.0"
edition = "2021"
description = "Open-source web GUI for VoIPmonitor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/litchdrom/rusto-voip-mon"
publish = false

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database (MySQL, read-only)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "chrono", "macros"] }

# Templating
askama = "0.12"
askama_axum = "0.4"

# axum-extra — we only need TypedHeader for cookie reading.
axum-extra = { version = "0.9", features = ["typed-header"] }

# Cookie + HMAC signing (manual, no SignedCookieJar to dodge feature churn).
cookie = "0.18"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Password hashing — bcrypt for modern VoIPmonitor users, MD5 for legacy
bcrypt = "0.15"
md-5 = "0.10"

# Config
dotenvy = "0.15"

# Errors / tracing
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time (std + clock + serde)
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# URL helpers
url = "2"
percent-encoding = "2"

# PCAP streaming: zstd-decompress voipmonitor's tar.zst pcap archive.
# (zip for the v0.2.1 batch download endpoint — sync std API used
#  inside spawn_blocking so we can drive it from a tokio mpsc without
#  fighting async-zip's duplex-stream ceremony.)
zstd = "0.13"
zip = "0.6"
# VoIPmonitor's RTP tar files store chunks as LZO-compressed pcap
# (prefixed with a 12-byte custom header "LZO\x9a" + metadata).
lzo = "0.1"

# Streaming helpers for CSV / PCAP responses
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
