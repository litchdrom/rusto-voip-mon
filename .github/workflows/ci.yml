name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo test
        run: cargo test --locked

  clippy:
    name: clippy (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Run clippy without -D warnings for now — the project has
      # pre-existing dead_code / unused_variables warnings that we
      # want to clean up incrementally. Once `cargo clippy --all-targets
      # -- -D warnings` runs clean, add that flag here to enforce
      # it on every PR.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets

  build-linux:
    name: build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild
      - name: Cross-compile via cargo-zigbuild
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: rusto-voip-mon-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/rusto-voip-mon
          if-no-files-found: error
